name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Doxygen API documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen
      - name: Generate API documentation
        run: |
          mkdir -p docs/api
          doxygen Doxyfile
